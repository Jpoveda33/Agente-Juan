<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente Juan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e8e3d8;
    font-family: Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #app {
    width: 100%;
    max-width: 760px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #header {
    padding: 1.5rem 1.5rem 1rem;
    border-bottom: 1px solid #1e1e2e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: #0a0a0f;
    z-index: 10;
  }
  .header-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: #5a5a7a;
    text-transform: uppercase;
    margin-bottom: 0.2rem;
  }
  .header-name {
    font-size: 1.2rem;
    font-weight: normal;
    color: #c8c0b0;
  }
  .btn {
    background: none;
    border: 1px solid #2a2a3e;
    color: #8888aa;
    padding: 0.35rem 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    font-family: Georgia, serif;
  }
  .btn:hover { border-color: #3a3a5e; color: #aaaacc; }
  .btn-danger {
    border-color: #3a1a1a;
    color: #7a4a4a;
  }
  .btn-danger:hover { border-color: #5a2a2a; color: #aa6a6a; }

  #profile-panel {
    display: none;
    margin: 0 1.5rem;
    padding: 1.25rem;
    background: #0f0f1a;
    border: 1px solid #1e1e2e;
    border-top: none;
  }
  #profile-panel.visible { display: block; }
  .profile-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: #5a5a7a;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  #insights-list {
    list-style: disc;
    padding-left: 1rem;
  }
  #insights-list li {
    color: #9898b8;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
    line-height: 1.5;
  }
  #no-insights {
    color: #4a4a6a;
    font-size: 0.82rem;
    font-style: italic;
  }
  #last-updated {
    margin-top: 1rem;
    font-size: 0.65rem;
    color: #3a3a5a;
  }
  #profile-actions {
    margin-top: 1rem;
    display: flex;
    gap: 0.75rem;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
  }
  .message-wrap {
    margin-bottom: 1.75rem;
    display: flex;
    flex-direction: column;
  }
  .message-wrap.user { align-items: flex-end; }
  .message-wrap.assistant { align-items: flex-start; }
  .message-role {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: #3a3a5a;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }
  .message-bubble {
    max-width: 88%;
    padding: 0.9rem 1.1rem;
    border-radius: 6px;
    font-size: 0.9rem;
    line-height: 1.7;
  }
  .message-bubble.user {
    background: #13132a;
    border: 1px solid #2a2a4e;
    color: #b0b0d0;
  }
  .message-bubble.assistant {
    background: #0f0f1a;
    border: 1px solid #1a1a2e;
    color: #d8d0c0;
  }
  .message-bubble p { margin-bottom: 0.3rem; }
  .message-bubble p:empty { margin-bottom: 0.5rem; }

  #typing {
    display: none;
    align-items: flex-start;
    margin-bottom: 1.5rem;
  }
  #typing.visible { display: flex; }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4a4a7a;
    margin-right: 5px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  #input-area {
    padding: 1rem 1.5rem 1.5rem;
    border-top: 1px solid #1a1a2a;
    background: #0a0a0f;
    position: sticky;
    bottom: 0;
  }
  #input-row {
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
  }
  #user-input {
    flex: 1;
    background: #0f0f1a;
    border: 1px solid #2a2a3e;
    border-radius: 6px;
    color: #d0c8b8;
    padding: 0.75rem 1rem;
    font-size: 0.88rem;
    font-family: Georgia, serif;
    resize: none;
    outline: none;
    line-height: 1.5;
  }
  #user-input:focus { border-color: #3a3a6e; }
  #send-btn {
    background: #2a2a5e;
    border: 1px solid #3a3a6e;
    color: #9898c8;
    padding: 0.75rem 1.1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    min-width: 44px;
    height: 52px;
    font-family: Georgia, serif;
  }
  #send-btn:disabled {
    background: #1a1a2e;
    color: #3a3a5a;
    cursor: not-allowed;
  }
  #input-hint {
    margin-top: 0.5rem;
    font-size: 0.62rem;
    color: #2a2a4a;
    text-align: center;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #0a0a0f; }
  ::-webkit-scrollbar-thumb { background: #1e1e3e; border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div>
      <div class="header-label">Agente de autoconocimiento</div>
      <div class="header-name">Juan</div>
    </div>
    <div>
      <button class="btn" id="profile-btn" onclick="toggleProfile()">Perfil (0)</button>
    </div>
  </div>

  <div id="profile-panel">
    <div class="profile-label">Lo que sé de ti hasta ahora</div>
    <p id="no-insights">Aún sin insights. Empieza a responder y el perfil irá creciendo.</p>
    <ul id="insights-list" style="display:none"></ul>
    <div id="last-updated" style="display:none"></div>
    <div id="profile-actions">
      <button class="btn" onclick="clearSession()">Nueva conversación</button>
      <button class="btn btn-danger" onclick="clearAll()">Borrar todo</button>
    </div>
  </div>

  <div id="messages">
    <div id="typing">
      <div style="padding:0.9rem 1.1rem;background:#0f0f1a;border:1px solid #1a1a2e;border-radius:6px;display:flex">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="user-input" rows="2" placeholder="Responde aquí... (Enter para enviar)"></textarea>
      <button id="send-btn" onclick="sendMessage()" disabled>↑</button>
    </div>
    <div id="input-hint">Shift+Enter para nueva línea · El perfil se guarda automáticamente</div>
  </div>
</div>

<script>
const STORAGE_KEY = "juan-agent-profile";
const HISTORY_KEY = "juan-agent-history";

const SYSTEM_PROMPT = `Eres un agente de autoconocimiento profundo para Juan. Tu único trabajo es ayudarlo a descubrirse a sí mismo a través de preguntas poderosas, conversaciones honestas y reflexiones acumuladas.

PERFIL BASE DE JUAN (lo que ya se sabe):
- Vive en Bogotá, Colombia
- Trabaja en el sector energético en Klik Energy (BEAM ENERGY INNOVATION S.A.S.) — rol comercial/estratégico
- Tiene proyectos de energía: Negratin, Lizama, Tolima Norte, SS
- Le apasiona el fútbol colombiano, los viajes, el esquí, la vela
- Tiene una hermana (Mónica) en Washington DC
- Tiene una propiedad Airbnb en Santa Marta
- Es bilingüe español/inglés
- Prefiere respuestas directas y prácticas

PERFIL DINÁMICO (va creciendo con cada conversación):
{{DYNAMIC_PROFILE}}

HISTORIAL DE RESPUESTAS PREVIAS:
{{HISTORY}}

INSTRUCCIONES CLAVE:
1. Haz UNA sola pregunta a la vez. Nunca hagas listas de preguntas.
2. Las preguntas deben ser profundas, específicas, incómodas a veces — no genéricas.
3. Alterna entre dimensiones: personal (miedos, relaciones, valores, sueños) y profesional (ambiciones, conflictos, identidad laboral).
4. Escucha activamente lo que Juan responde. Refleja, conecta con respuestas anteriores.
5. Cada cierto tiempo (cada 5-7 intercambios), consolida lo aprendido diciendo: "He actualizado lo que sé de ti:" y lista 2-3 insights nuevos. Esos insights deben terminar con el tag especial: [SAVE: insight aquí]
6. No seas terapeuta genérico. Sé curioso, directo, a veces provocador.
7. Si Juan dice algo contradictorio con algo anterior, señálalo con respeto.
8. Responde siempre en español.
9. Al inicio de cada conversación nueva, reconoce brevemente lo que recuerdas de él y propón un tema nuevo para explorar.`;

let profile = {};
let messages = [];
let loading = false;

const INITIAL_MSG = {
  role: "assistant",
  content: "Hola Juan. Volvemos.\n\nCada vez que hablamos, te conozco un poco más. Hoy quiero explorar algo diferente contigo.\n\n**¿Cuándo fue la última vez que hiciste algo que te asustara de verdad — y cómo te sentiste después?**"
};

function init() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) profile = JSON.parse(saved);
  } catch {}
  try {
    const hist = localStorage.getItem(HISTORY_KEY);
    if (hist) {
      const parsed = JSON.parse(hist);
      if (parsed.length > 0) messages = parsed;
    }
  } catch {}
  if (messages.length === 0) messages = [INITIAL_MSG];
  renderMessages();
  updateProfilePanel();
}

function renderMessages() {
  const container = document.getElementById("messages");
  const typing = document.getElementById("typing");
  // Remove all message elements but keep typing indicator
  [...container.children].forEach(el => {
    if (el.id !== "typing") el.remove();
  });
  messages.forEach(msg => {
    const wrap = document.createElement("div");
    wrap.className = `message-wrap ${msg.role}`;
    const label = document.createElement("div");
    label.className = "message-role";
    label.textContent = msg.role === "user" ? "Tú" : "Agente";
    const bubble = document.createElement("div");
    bubble.className = `message-bubble ${msg.role}`;
    bubble.innerHTML = formatText(msg.content);
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    container.insertBefore(wrap, typing);
  });
  scrollBottom();
}

function formatText(text) {
  return text.split("\n").map(line => {
    const bold = line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    return `<p>${bold || "&nbsp;"}</p>`;
  }).join("");
}

function scrollBottom() {
  const m = document.getElementById("messages");
  m.scrollTop = m.scrollHeight;
}

function updateProfilePanel() {
  const btn = document.getElementById("profile-btn");
  const count = profile.insights?.length || 0;
  btn.textContent = `Perfil (${count})`;

  const list = document.getElementById("insights-list");
  const none = document.getElementById("no-insights");
  const lastUpd = document.getElementById("last-updated");

  if (count > 0) {
    list.style.display = "block";
    none.style.display = "none";
    list.innerHTML = profile.insights.map(i => `<li>${i}</li>`).join("");
    if (profile.lastUpdated) {
      lastUpd.style.display = "block";
      lastUpd.textContent = "Última actualización: " + new Date(profile.lastUpdated).toLocaleDateString("es-CO", { day:"numeric", month:"long", year:"numeric" });
    }
  } else {
    list.style.display = "none";
    none.style.display = "block";
    lastUpd.style.display = "none";
  }
}

function toggleProfile() {
  const panel = document.getElementById("profile-panel");
  panel.classList.toggle("visible");
  const btn = document.getElementById("profile-btn");
  const count = profile.insights?.length || 0;
  btn.textContent = panel.classList.contains("visible") ? "Ocultar perfil" : `Perfil (${count})`;
}

function saveInsights(text) {
  const regex = /\[SAVE: ([^\]]+)\]/g;
  let match;
  const newInsights = [];
  while ((match = regex.exec(text)) !== null) newInsights.push(match[1]);
  if (newInsights.length > 0) {
    if (!profile.insights) profile.insights = [];
    profile.insights = [...profile.insights, ...newInsights];
    profile.lastUpdated = new Date().toISOString();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(profile)); } catch {}
    updateProfilePanel();
  }
  return text.replace(/\[SAVE: [^\]]+\]/g, "").trim();
}

function buildSystemPrompt() {
  const dynamicProfile = profile.insights
    ? profile.insights.map((ins, i) => `${i+1}. ${ins}`).join("\n")
    : "Aún no hay insights guardados. Esta puede ser la primera sesión.";
  const recentHistory = messages.slice(-20)
    .map(m => `${m.role === "user" ? "Juan" : "Agente"}: ${m.content}`)
    .join("\n");
  return SYSTEM_PROMPT
    .replace("{{DYNAMIC_PROFILE}}", dynamicProfile)
    .replace("{{HISTORY}}", recentHistory || "Primera sesión.");
}

async function sendMessage() {
  const input = document.getElementById("user-input");
  const text = input.value.trim();
  if (!text || loading) return;

  loading = true;
  document.getElementById("send-btn").disabled = true;
  input.value = "";

  messages.push({ role: "user", content: text });
  renderMessages();

  document.getElementById("typing").classList.add("visible");
  scrollBottom();

  const systemPrompt = buildSystemPrompt();
  const apiMessages = messages.map(m => ({ role: m.role, content: m.content }));

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: apiMessages,
      }),
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(`HTTP ${res.status}: ${errData?.error?.message || res.statusText}`);
    }

    const data = await res.json();
    const rawText = data.content?.[0]?.text || "...";
    const cleanText = saveInsights(rawText);
    messages.push({ role: "assistant", content: cleanText });
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(messages.slice(-60))); } catch {}
  } catch (e) {
    messages.push({ role: "assistant", content: `Error: ${e.message}` });
  }

  document.getElementById("typing").classList.remove("visible");
  loading = false;
  document.getElementById("send-btn").disabled = false;
  renderMessages();
}

function clearSession() {
  if (confirm("¿Borrar esta conversación? El perfil acumulado se mantiene.")) {
    messages = [INITIAL_MSG];
    try { localStorage.removeItem(HISTORY_KEY); } catch {}
    renderMessages();
  }
}

function clearAll() {
  if (confirm("¿Borrar TODO incluyendo el perfil? Esto no se puede deshacer.")) {
    messages = [INITIAL_MSG];
    profile = {};
    try {
      localStorage.removeItem(HISTORY_KEY);
      localStorage.removeItem(STORAGE_KEY);
    } catch {}
    renderMessages();
    updateProfilePanel();
  }
}

// Input events
document.getElementById("user-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById("user-input").addEventListener("input", function() {
  document.getElementById("send-btn").disabled = !this.value.trim() || loading;
});

init();
</script>
</body>
</html>
